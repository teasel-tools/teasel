[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teasel"
version = "0.3.1"
description = "Connect lab instruments to AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.27.0",
    "typer>=0.12",
    "rich>=13",
    "textual>=0.70",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "websockets>=12",
    "anthropic>=0.40",
    "forge-guardrails>=0.7.4",
    "tomli-w>=1.2.0",
]

[project.scripts]
teasel = "teasel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teasel"]
