name: Release and publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - teasel-cli/pyproject.toml
      - teasel-server/pyproject.toml
  # Manual run: publishes any package whose current version has no release tag
  # yet (the tag check below prevents re-publishing an existing version).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write  # required for trusted publishing

    strategy:
      matrix:
        include:
          - package: teasel
            path: teasel-cli
            tag_prefix: teasel-v
          - package: teasel-server
            path: teasel-server
            tag_prefix: server-v

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if this package's pyproject.toml was changed
        id: changed
        run: |
          # Compare the whole pushed range, not just the last commit — a multi-commit
          # push that bumps a version in an earlier commit must still publish it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -q "^${{ matrix.path }}/pyproject.toml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Read version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(grep '^version' ${{ matrix.path }}/pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        if: steps.changed.outputs.changed == 'true'
        id: tag_check
        run: |
          TAG="${{ matrix.tag_prefix }}${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v6
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          pip install build
          python -m build ${{ matrix.path }}

      - name: Publish to PyPI
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist/

      - name: Create GitHub release
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ matrix.tag_prefix }}${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "${{ matrix.package }} ${{ steps.version.outputs.version }}" \
            --generate-notes
